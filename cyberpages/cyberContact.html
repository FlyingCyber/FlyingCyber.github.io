<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<title>Cyber Contact</title>
		<link rel="stylesheet" href="../stylesheets/index.css">
	</head>

	<body>
		<article id="page">
			<header>

				<div class="container">
					<div id="navbar"></div>
					
				</div>

			</header>

			<section class="cyber-intro">

				<div class="cyber-intro-container">

					<h1 class="cyber-intro-title">
						Contact Us About Cyber
					</h1>

					<form id="cyber-contact-form">
						
						<div class="cyber-contact-form-element">
							<label for="first-name">First Name:</label><br>
							<input type="text" id="first-name" name="entry.680741528" required>
						</div>
						<div class="cyber-contact-form-element">
							<label for="last-name">Last Name:</label><br>
							<input type="text" id="last-name" name="entry.827147269" required>
						</div>
						<div class="cyber-contact-form-element">
							<label for="e-mail">E-mail:</label><br>
							<input type="email" id="e-mail" name="entry.1568768754" required>
						</div>
						<div class="cyber-contact-form-element">
							<label for="phone">Phone Number:</label><br>
							<input type="tel" id="phone" name="entry.2131087287">
						</div>
						<div class="cyber-contact-form-element">
							<p class="org">What type of organization are you?</p>
							<label>
								<input type="radio" name="entry.2145183" value="Retirement Home" required>Retirement Home
							</label><br>
							<label>
								<input type="radio" name="entry.2145183" value="Church">Church
							</label><br>
							<label>
								<input type="radio" name="entry.2145183" value="High School">High School
							</label><br>
							<label>
								<input type="radio" name="entry.2145183" value="Middle School">Middle School
							</label><br>
							<label>
								<input type="radio" name="entry.2145183" value="Elementary School">Elementary School
							</label>
						</div>
						<div class="cyber-contact-form-element">
							<label for="message">Message:</label> <br>
							<textarea id="message" name="entry.1103228302" rows="5" cols="30"></textarea>
						</div>

						<button type="submit" id="cyber-submit" class="cyber-contact-form-element">Submit</button>

					</form>
					<div id="successMessage" style="display:none; color: green; font-weight: bold;">
    					Thank you! Your response has been recorded directly to our database.
					</div>

				</div>

			</section>

		</article>

		<script src="../scripts/navbar.js"></script>
		<script src="../scripts/cyberForm.js"></script>

	</body>

</html>
